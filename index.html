    input:not([type="checkbox"]) { width:100%; height:48px; padding:0 15px; border:1px solid #ffffff26; border-radius:11px; outline:none; color:#fff; background:#0b121d; font:inherit; font-size:15px; }
    input:focus { border-color:#4dc9af; box-shadow:0 0 0 3px #4dc9af20; }
    .remember { display:flex; align-items:center; gap:10px; margin:18px 0 0; color:#aebdcd; font-size:13px; font-weight:600; cursor:pointer; }
    .remember input { width:17px; height:17px; margin:0; accent-color:#4dc9af; }
    button { width:100%; height:50px; margin-top:28px; border:0; border-radius:11px; color:#09201c; background:linear-gradient(135deg,#69e0bd,#3ac4ad); font:inherit; font-size:14px; font-weight:800; cursor:pointer; transition:transform .18s,filter .18s; }
    button:hover { transform:translateY(-1px); filter:brightness(1.06); }
    button:disabled { opacity:.6; cursor:wait; }
    #error { min-height:20px; margin:14px 0 0; color:#ff899d; font-size:13px; }
    .foot { display:flex; justify-content:space-between; color:#738397; font-size:12px; margin-top:23px; }
    #dashboard-frame { display:block; width:100%; height:100vh; border:0; background:#0b1019; }

    #logout:hover { color:#fff; border-color:#ffffff40; background:#172334e8; }
    [hidden] { display:none!important; }
    @media(max-width:500px){ .card{padding:28px 23px}.foot{gap:14px} }

  <script>
    (() => {
      const decoder = new TextDecoder();
      const encoder = new TextEncoder();
      const form = document.getElementById('login-form');
      const login = document.getElementById('login-screen');
      const frame = document.getElementById('dashboard-frame');
      const submit = document.getElementById('submit');
      const error = document.getElementById('error');
      const remember = document.getElementById('remember');
      const logout = document.getElementById('logout');
      let activeKey = null;
      const authDbName = 'bbu-fleet-auth-v8';
      const authStoreName = 'sessions';
      const authRecordId = location.pathname;
      const rememberDuration = 7 * 24 * 60 * 60 * 1000;
      const fromB64 = value => Uint8Array.from(atob(value), ch => ch.charCodeAt(0));
      const toB64 = bytes => {
        let result = '';
        for (let i = 0; i < bytes.length; i += 32768) result += String.fromCharCode(...bytes.subarray(i, i + 32768));
        return btoa(result);
      };
      const openAuthDb = () => new Promise((resolve, reject) => {
        const request = indexedDB.open(authDbName, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(authStoreName)) request.result.createObjectStore(authStoreName, { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      const readRemembered = async () => {
        const db = await openAuthDb();
        return new Promise((resolve, reject) => {
          const request = db.transaction(authStoreName, 'readonly').objectStore(authStoreName).get(authRecordId);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        }).finally(() => db.close());
      };
      const saveRemembered = async (key, salt) => {
        const db = await openAuthDb();
        return new Promise((resolve, reject) => {
          const request = db.transaction(authStoreName, 'readwrite').objectStore(authStoreName).put({ id:authRecordId, key, salt, expiresAt:Date.now() + rememberDuration });
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        }).finally(() => db.close());
      };
      const clearRemembered = async () => {
        const db = await openAuthDb();
        return new Promise((resolve, reject) => {
          const request = db.transaction(authStoreName, 'readwrite').objectStore(authStoreName).delete(authRecordId);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        }).finally(() => db.close());
      };
      const unlock = async (key, payload) => {
        const plaintext = await crypto.subtle.decrypt({ name:'AES-GCM', iv:fromB64(payload.iv) }, key, fromB64(payload.ciphertext));
        activeKey = key;
        frame.srcdoc = decoder.decode(plaintext);
        document.getElementById('password').value = '';
        login.hidden = true;
        frame.hidden = false;
        logout.hidden = false;
        frame.focus();
      };
      form.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        submit.disabled = true;
        submit.textContent = 'กำลังเปิดข้อมูล...';
        try {
          if (!crypto.subtle) throw new Error('Secure context required');
          const payload = JSON.parse(document.getElementById('payload').textContent);
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          const baseKey = await crypto.subtle.importKey('raw', encoder.encode(username + '\0' + password), 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:fromB64(payload.salt), iterations:payload.iterations, hash:'SHA-256' }, baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
          await unlock(key, payload);
          if (remember.checked) await saveRemembered(key, payload.salt).catch(() => {});
          else await clearRemembered().catch(() => {});
        } catch (cause) {
          error.textContent = cause.message === 'Secure context required' ? 'กรุณาเปิดผ่าน HTTPS' : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
        } finally {
          submit.disabled = false;
          submit.textContent = 'เปิด Dashboard ↗';
        }
      });
      logout.addEventListener('click', async () => {
        await clearRemembered().catch(() => {});
        activeKey = null;
        frame.srcdoc = '';
        frame.hidden = true;
        logout.hidden = true;
        login.hidden = false;
        remember.checked = false;
        document.getElementById('username').focus();
      });
      (async () => {
        try {
          const payload = JSON.parse(document.getElementById('payload').textContent);
          const saved = await readRemembered();
          if (!saved || saved.expiresAt <= Date.now() || saved.salt !== payload.salt) {
            if (saved) await clearRemembered().catch(() => {});
            return;
          }
          await unlock(saved.key, payload);
        } catch {
          await clearRemembered().catch(() => {});
        }
      })();
      window.addEventListener('message', async event => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin || event.data?.type !== 'bbu-encrypted-export' || !activeKey) return;
        try {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, activeKey, encoder.encode(event.data.html));
          const payload = JSON.parse(document.getElementById('payload').textContent);
          payload.iv = toB64(iv);
          payload.ciphertext = toB64(new Uint8Array(ciphertext));
          const clone = document.documentElement.cloneNode(true);
          clone.querySelector('#dashboard-frame').removeAttribute('srcdoc');
          clone.querySelector('#dashboard-frame').setAttribute('hidden', '');
          clone.querySelector('#login-screen').removeAttribute('hidden');
          clone.querySelector('#payload').textContent = JSON.stringify(payload);
          clone.querySelector('#username').removeAttribute('value');
          clone.querySelector('#password').removeAttribute('value');
          const html = '<!doctype html>\n' + clone.outerHTML;
          const blob = new Blob([html], { type:'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'BBU_Fleet_Dashboard_protected_v8_Updated_' + new Date().toISOString().slice(0,10) + '.html';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (cause) { alert('บันทึกไฟล์เข้ารหัสไม่สำเร็จ กรุณาลองใหม่'); }
      });
    })();
  </script>
