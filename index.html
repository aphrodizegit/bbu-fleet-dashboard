      const toB64 = bytes => {
        let result = '';
        for (let i = 0; i < bytes.length; i += 32768) result += String.fromCharCode(...bytes.subarray(i, i + 32768));
        return btoa(result);
      };
      form.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        submit.disabled = true;
        submit.textContent = 'กำลังเปิดข้อมูล...';
        try {
          if (!crypto.subtle) throw new Error('Secure context required');
          const payload = JSON.parse(document.getElementById('payload').textContent);
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          const baseKey = await crypto.subtle.importKey('raw', encoder.encode(username + '\0' + password), 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:fromB64(payload.salt), iterations:payload.iterations, hash:'SHA-256' }, baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
          const plaintext = await crypto.subtle.decrypt({ name:'AES-GCM', iv:fromB64(payload.iv) }, key, fromB64(payload.ciphertext));
          activeKey = key;
          frame.srcdoc = decoder.decode(plaintext);
          document.getElementById('password').value = '';
          login.hidden = true;
          frame.hidden = false;
          frame.focus();
        } catch (cause) {
          error.textContent = cause.message === 'Secure context required' ? 'กรุณาเปิดผ่าน HTTPS' : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
        } finally {
          submit.disabled = false;
          submit.textContent = 'เปิด Dashboard ↗';
        }
      });
      window.addEventListener('message', async event => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin || event.data?.type !== 'bbu-encrypted-export' || !activeKey) return;
        try {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, activeKey, encoder.encode(event.data.html));
          const payload = JSON.parse(document.getElementById('payload').textContent);
          payload.iv = toB64(iv);
          payload.ciphertext = toB64(new Uint8Array(ciphertext));
          const clone = document.documentElement.cloneNode(true);
          clone.querySelector('#dashboard-frame').removeAttribute('srcdoc');
          clone.querySelector('#dashboard-frame').setAttribute('hidden', '');
          clone.querySelector('#login-screen').removeAttribute('hidden');
          clone.querySelector('#payload').textContent = JSON.stringify(payload);
          clone.querySelector('#username').removeAttribute('value');
          clone.querySelector('#password').removeAttribute('value');
          const html = '<!doctype html>\n' + clone.outerHTML;
          const blob = new Blob([html], { type:'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'BBU_Fleet_Dashboard_protected_v8_Updated_' + new Date().toISOString().slice(0,10) + '.html';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (cause) { alert('บันทึกไฟล์เข้ารหัสไม่สำเร็จ กรุณาลองใหม่'); }
      });
    })();
  </script>
